<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div id="body">
        <div id="screen">0</div>
        <div id="row1" class="row">
            <button class="number">7</button>
            <button class="number">8</button>
            <button class="number">9</button>
            <button id="division" class="operator">÷</button>
        </div>
        <div id="row2" class="row">
            <button class="number">4</button>
            <button class="number">5</button>
            <button class="number">6</button>
            <button id="multiplication" class="operator">x</button>
        </div>
        <div id="row3" class="row">
            <button class="number">1</button>
            <button class="number">2</button>
            <button class="number">3</button>
            <button id="addition" class="operator">+</button>
        </div>
        <div id="row4" class="row">
            <button class="number">0</button>
            <button id="allClear">AC</button>
            <button id="equals">=</button>
            <button id="subtraction" class="operator">-</button>
        </div>
        <div id="footer">Powered by Basswood Industries Ltd.</div>
    </div>
</body>
</html>
